[package]
name = "megahit-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "An experimental, deterministic, fixed-k metagenome assembler in Rust"
license = "GPL-3.0-or-later"
repository = "https://github.com/2shakilrafi/megahit-rs"
keywords = ["bioinformatics", "metagenomics", "assembly", "de-bruijn-graph"]
categories = ["science", "command-line-utilities"]

[dependencies]
clap = { version = "4.5.39", features = ["derive"] }
needletail = { version = "0.7.3", default-features = false, features = ["bzip2", "flate2"] }
rayon = "1.12.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

[dev-dependencies]
bzip2 = "0.6.1"
flate2 = "1.1.1"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true

[profile.test]
opt-level = 1

