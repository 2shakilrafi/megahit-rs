name: NMDC small-test benchmark

on:
  workflow_dispatch:
    inputs:
      replicates:
        description: Replicates per assembler configuration
        required: true
        default: "3"
        type: choice
        options:
          - "1"
          - "3"
          - "5"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build megahit-rs
        run: cargo build --release --locked

      - name: Install evaluation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes minimap2 samtools time

      - name: Download pinned input and MEGAHIT
        run: |
          mkdir -p benchmark-work
          curl --fail --location --retry 3 \
            https://portal.nersc.gov/project/m3408/test_data/smalltest.int.fastq.gz \
            --output benchmark-work/smalltest.int.fastq.gz
          curl --fail --location --retry 3 \
            https://github.com/voutcn/megahit/releases/download/v1.2.9/MEGAHIT-1.2.9-Linux-x86_64-static.tar.gz \
            --output benchmark-work/MEGAHIT-1.2.9-Linux-x86_64-static.tar.gz
          sha256sum --check benchmarks/nmdc-smalltest/checksums.sha256
          tar --extract --gzip \
            --file benchmark-work/MEGAHIT-1.2.9-Linux-x86_64-static.tar.gz \
            --directory benchmark-work

      - name: Run comparison
        run: |
          python3 benchmarks/nmdc-smalltest/benchmark.py \
            --input benchmark-work/smalltest.int.fastq.gz \
            --rust-bin target/release/megahit-rs \
            --megahit-bin benchmark-work/MEGAHIT-1.2.9-Linux-x86_64-static/bin/megahit \
            --minimap2-bin /usr/bin/minimap2 \
            --samtools-bin /usr/bin/samtools \
            --output benchmark-work/results \
            --threads 8 \
            --runs "${{ inputs.replicates }}"

      - name: Render report
        if: success()
        run: |
          python3 benchmarks/nmdc-smalltest/render_report.py \
            benchmark-work/results/benchmark.json \
            benchmark-work/results/REPORT.md

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nmdc-smalltest-benchmark-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            benchmark-work/results/benchmark.json
            benchmark-work/results/REPORT.md
            benchmark-work/results/*-flagstat.json
            benchmark-work/results/*-run*/time.txt
            benchmark-work/results/*-run*/stdout.log
            benchmark-work/results/*-run*/stderr.log
